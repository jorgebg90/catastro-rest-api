name: Deploy to Apify

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: apify-deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - name: Validate Actor schema
              run: npx --yes apify-cli validate-schema
              env:
                  APIFY_CLI_DISABLE_TELEMETRY: '1'
            - name: Push Actor to Apify
              run: npx --yes apify-cli push
              env:
                  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
                  APIFY_CLI_DISABLE_TELEMETRY: '1'
