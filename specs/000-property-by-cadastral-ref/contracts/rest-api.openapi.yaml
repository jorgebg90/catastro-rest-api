openapi: 3.0.3
info:
  title: Catastro REST API
  version: 0.1.0
  description: Synchronous REST wrapper over the Catastro Consulta_DNPRC SOAP operation.
paths:
  /:
    get:
      summary: Standby readiness probe
      responses:
        '200': { description: Actor ready }
  /properties/{reference}:
    get:
      summary: Get property(ies) by cadastral reference
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, example: 9872023VH5797S0001WX }
      responses:
        '200':
          description: Properties found
          content:
            application/json:
              schema:
                type: object
                required: [reference, properties]
                properties:
                  reference: { type: string }
                  properties:
                    type: array
                    items: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_CADASTRAL_REFERENCE, PROPERTY_NOT_FOUND, CADASTRE_TIMEOUT, CADASTRE_UNAVAILABLE, CADASTRE_PROTOCOL_ERROR, INTERNAL_ERROR]
        message: { type: string }
        upstream:
          type: object
          nullable: true
          properties:
            code: { type: string }
            description: { type: string }
    Property:
      type: object
      required: [reference, provinceName, municipalityName, address, constructions]
      properties:
        reference: { type: string }
        propertyClass: { type: string, enum: [URBAN, RUSTIC], nullable: true }
        provinceCode: { type: string }
        provinceName: { type: string }
        municipalityCode: { type: string }
        municipalityName: { type: string }
        address: { type: string }
        postalCode: { type: string, nullable: true }
        use: { type: string, nullable: true }
        surfaceSquareMeters: { type: number, nullable: true }
        participationPercent: { type: number, nullable: true }
        constructionYear: { type: integer, nullable: true }
        constructions:
          type: array
          items:
            type: object
            properties:
              use: { type: string }
              floor: { type: string, nullable: true }
              door: { type: string, nullable: true }
              surfaceSquareMeters: { type: number, nullable: true }
